services:
  # Web app (Next.js + SQLite, data persisted in the app_data volume)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifetracker_app
    restart: unless-stopped
    environment:
      # Strongly recommended when the dashboard is reachable from the internet.
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - app_data:/app/data
    networks:
      - dashboard_net

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: lifetracker_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - dashboard_net

volumes:
  app_data:
  caddy_data:
  caddy_config:

networks:
  dashboard_net:
    driver: bridge
